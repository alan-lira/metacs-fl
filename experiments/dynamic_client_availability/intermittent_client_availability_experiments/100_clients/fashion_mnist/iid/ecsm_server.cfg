[Logging Settings]
enable_logging = Yes
log_to_file = Yes
log_to_console = Yes
file_name = logging/flower_server.log
file_mode = w
encoding = utf-8
level = INFO
format_str = %%(asctime)s.%%(msecs)03d %%(levelname)s: %%(message)s
date_format = %%Y/%%m/%%d %%H:%%M:%%S

[FL Settings]
stopping_criteria = FL_Stop_Multi_Criteria_1
num_rounds = 100
round_timeout_in_seconds = 300
wait_for_initial_clients = {num_clients_to_wait: 100, waiting_timeout_in_seconds: infinity}
enable_training = Yes
enable_testing = Yes
accept_clients_failures = Yes
remove_clients_models_on_finish = Yes

[FL_Stop_Max_Rounds Settings]
logical_operator = OR
criterion_1 = {name: Max_Rounds, max_rounds: 1}

[FL_Stop_Multi_Criteria_1 Settings]
logical_operator = OR
criterion_1 = {name: Max_Rounds, max_rounds: 100}
criterion_2 = {name: Min_Test_Accuracy, min_test_accuracy: 0.85}

[Server Strategy Settings]
strategy = ECSM

[Random Settings]
seed = 777
fraction_clients_training = 0.1
fraction_clients_testing = 1.0
model_aggregator = FedAvg
metrics_aggregator = Weighted_Average

[ECSM Settings]
seed = 777
samples_per_task = 1
num_tasks_profile_training = [200]
num_tasks_profile_testing = [200]
num_tasks_training = 24000
num_tasks_testing = 10000
client_selector_training = ECSM
client_selector_testing = Random
model_aggregator = FedAvg
metrics_aggregator = Weighted_Average
query_clients_data_distribution = Yes
data_privacy_approach = Differentially_Private
accuracy_ratio = 20
reputation_ratio = 70
random_ratio = 10

[Differentially_Private Settings]
true_presence_probability = 1.0
presence_cutoff = 0.5
epsilon = 0.1

[FedAvg Settings]
inplace_aggregation = False

[FedProx Settings]
mu = 1.0

[SSL Settings]
enable_ssl = No
ca_certificate_file = ssl_certificates/ca_certificate.crt
server_certificate_file = ssl_certificates/server_certificate.pem
server_rsa_private_key_file = ssl_certificates/server_rsa_private.key

[gRPC Settings]
listen_ip_address = 0.0.0.0
listen_port = 8080
max_message_length_in_bytes = 536870912

[Fit_Config Settings]
learning_rate = 0.001
shuffle = True
batch_size = 32
initial_epoch = 0
epochs = 5
steps_per_epoch = None
validation_split = 0
validation_batch_size = 32
verbose = 2

[Evaluate_Config Settings]
batch_size = 32
steps = None
verbose = 2

[Output Settings]
remove_output_files = No
selected_fit_clients_history_file = output/selected_fit_clients_history.csv
individual_fit_metrics_history_file = output/individual_fit_metrics_history.csv
selected_evaluate_clients_history_file = output/selected_evaluate_clients_history.csv
individual_evaluate_metrics_history_file = output/individual_evaluate_metrics_history.csv
