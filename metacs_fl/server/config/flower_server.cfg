[Logging Settings]
enable_logging = Yes
log_to_file = Yes
log_to_console = Yes
file_name = logging/flower_server.log
file_mode = w
encoding = utf-8
level = INFO
format_str = %%(asctime)s.%%(msecs)03d %%(levelname)s: %%(message)s
date_format = %%Y/%%m/%%d %%H:%%M:%%S

[FL Settings]
stopping_criteria = FL_Stop_Multi_Criteria_1
num_rounds = 10
round_timeout_in_seconds = infinity
wait_for_initial_clients = {num_clients_to_wait: 100, waiting_timeout_in_seconds: infinity}
enable_training = Yes
enable_testing = Yes
accept_clients_failures = Yes

[FL_Stop_Max_Rounds Settings]
logical_operator = OR
criterion_1 = {name: Max_Rounds, max_rounds: 1}

[FL_Stop_Multi_Criteria_1 Settings]
logical_operator = OR
criterion_1 = {name: Max_Rounds, max_rounds: 10}
criterion_2 = {name: Min_Test_Accuracy, min_test_accuracy: 0.99}

[Server Strategy Settings]
strategy = MetaCS-FL

[Random Settings]
seed = 777
fraction_clients_training = 0.1
fraction_clients_testing = 1.0
model_aggregator = FedAvg
metrics_aggregator = Weighted_Average

[SBAC-PAD_2024 Settings]
seed = 777
samples_per_task = 1
num_tasks_profile_training = 200
num_tasks_profile_testing = 200
num_tasks_training = 0.02
num_tasks_testing = 0.02
client_selector_training = ECMTC
client_selector_testing = Random
select_clients_for_immediate_next_round_while_executing_current_training = Yes
select_clients_for_immediate_next_round_while_executing_current_testing = Yes
model_aggregator = FedAvg
metrics_aggregator = Weighted_Average
history_checker = All_Previous_Rounds
query_clients_data_distribution = Yes
data_privacy_approach = Differentially_Private

[MetaCS-FL Settings]
seed = 777
samples_per_task = 1
num_tasks_profile_training = 200
num_tasks_profile_testing = 200
num_tasks_training = 0.02
num_tasks_testing = 0.02
new_client_selection_criteria_training = New_Client_Selection_Multi_Criteria_1
new_initial_solution_criteria_training = New_Initial_Solution_Max_Rounds
initial_solution_generator_training = ECMTC
run_metaheuristic_training = Yes
dynamically_adjust_learning_rate_training = No
dynamically_adjust_batch_size_training = No
dynamically_adjust_num_epochs_training = No
new_client_selection_criteria_testing = New_Client_Selection_Client_Diversity_Score
new_initial_solution_criteria_testing = New_Initial_Solution_Max_Rounds
initial_solution_generator_testing = Random
run_metaheuristic_testing = No
initial_solution_tasks_distribution_scheme = locally_balanced
metaheuristic_solution_tasks_distribution_scheme = globally_balanced
metaheuristic = LNS
model_aggregator = FedAvg
metrics_aggregator = Weighted_Average
undesired_metrics_for_fit_aggregation = []
undesired_metrics_for_evaluate_aggregation = []
query_clients_data_distribution = Yes
data_privacy_approach = Differentially_Private
monitor_clients_reliability_score = Yes
apply_clients_reliability_filter = Yes

[Differentially_Private Settings]
true_presence_probability = 1.0
presence_cutoff = 0.5
epsilon = 0.1

[Clients Reliability Score Settings]
non_availability_penalty = 0.3
non_completion_penalty = 0.7
recency_weight = 0.2

[New_Client_Selection_Multi_Criteria_1 Settings]
criterion_1 = {name: client_diversity_score_training, minimum_score: 0.5, num_past_rounds: 3}
criterion_2 = {name: makespan_percentage_increase_training, maximum_increase: 0.1, num_past_rounds: 2}
criterion_3 = {name: energy_consumption_percentage_increase_training, maximum_increase: 0.1, num_past_rounds: 2}
criterion_4 = {name: accuracy_percentage_decrease_testing, maximum_decrease: 0.1, num_past_rounds: 2}

[New_Client_Selection_Client_Diversity_Score Settings]
criterion_1 = {name: client_diversity_score_testing, minimum_score: 0.5, num_past_rounds: 5}

[New_Initial_Solution_Max_Rounds Settings]
criterion_1 = {name: max_rounds_same_initial_solution, maximum_rounds: 10}

[LNS Settings]
stopping_criteria = LNS_Stop_Elapsed_Time
destroy_approach = LNS_Destroy_Random_Task_Assignment_Change
repair_approach = LNS_Repair_Random_Task_Assignment_Change
accept_criteria = LNS_Accept_All_Constraints_Met
obj_func_weights = {M_weight: 0.05, E_weight: 0.05, D_weight: 0.4, KCov_weight: 0.3, KStd_weight: 0.2}

[LNS_Stop_Elapsed_Time Settings]
t_max = 10

[LNS_Stop_Max_Iterations Settings]
it_max = 1000

[LNS_Destroy_Random_Task_Assignment_Change Settings]
sf = 0.3
rf_min = 0.15
rf_max = 0.75

[LNS_Accept_All_Constraints_Met Settings]
D_pc_min = 0.1
M_pc_max = 0.25
E_pc_max = 0.25
bl_min = 0

[FedAvg Settings]
inplace_aggregation = False

[FedProx Settings]
mu = 1.0

[SSL Settings]
enable_ssl = No
ca_certificate_file = ssl_certificates/ca_certificate.crt
server_certificate_file = ssl_certificates/server_certificate.pem
server_rsa_private_key_file = ssl_certificates/server_rsa_private.key

[gRPC Settings]
listen_ip_address = 0.0.0.0
listen_port = 8080
max_message_length_in_bytes = 536870912

[Fit_Config Settings]
learning_rate = 0.001
shuffle = True
batch_size = 32
initial_epoch = 0
epochs = 1
steps_per_epoch = None
validation_split = 0
validation_batch_size = 32
verbose = 2

[Evaluate_Config Settings]
batch_size = 32
steps = None
verbose = 2

[Output Settings]
remove_output_files = No
selected_fit_clients_history_file = output/selected_fit_clients_history.csv
individual_fit_metrics_history_file = output/individual_fit_metrics_history.csv
selected_evaluate_clients_history_file = output/selected_evaluate_clients_history.csv
individual_evaluate_metrics_history_file = output/individual_evaluate_metrics_history.csv
