[Logging Settings]
enable_logging = Yes
log_to_file = Yes
log_to_console = Yes
file_name = logging/flower_client.log
file_mode = w
encoding = utf-8
level = INFO
format_str = %%(asctime)s.%%(msecs)03d %%(levelname)s: %%(message)s
date_format = %%Y/%%m/%%d %%H:%%M:%%S

[Daemon Settings]
enable_daemon_mode = No
start_method = forkserver

[Affinity Settings]
affinity_method = CPU_Cores_List
cpu_cores_list = []

[Learning Rate Schedule Settings]
enable_learning_rate_schedule = No
learning_rate_schedule_name = ExponentialDecay

[CosineDecay Learning Rate Schedule Settings]
initial_learning_rate = 0.001
decay_steps = 1000
alpha = 0.0
name = CosineDecay
warmup_target = None
warmup_steps = 1000

[ExponentialDecay Learning Rate Schedule Settings]
initial_learning_rate = 0.001
decay_steps = 25000
decay_rate = 0.96
staircase = False
name = ExponentialDecay

[Callbacks Settings]
enable_reduce_lr_on_plateau_callback = No
enable_early_stopping_callback = No

[ReduceLROnPlateau Callback Settings]
monitor = val_loss
factor = 0.5
patience = 5
verbose = 1
mode = auto
min_delta = 0.0001
cooldown = 2
min_lr = 0.000001

[EarlyStopping Callback Settings]
monitor = val_loss
min_delta = 0.0001
patience = 5
verbose = 1
mode = min
baseline = None
restore_best_weights = True
start_from_epoch = 0

[SSL Settings]
enable_ssl = No
ca_certificate_file = ssl_certificates/ca_certificate.crt

[gRPC Settings]
server_ip_address = 127.0.0.1
server_port = 8080
max_message_length_in_bytes = 536870912
max_connection_retries = 5
max_backoff_in_seconds = 32

[Dataset Settings]
loading_approach = FederatedDataset

[Local Dataset Settings]
dataset = CIFAR-10
dataset_root_folder = ../CIFAR-10_Balanced/50_balanced_partitions/partition_0
dataset_type = multi_class_image_classification

[FederatedDataset Settings]
dataset = adilbekovich/Sentiment140Twitter
subset = None
dataset_partitioner = IidPartitioner
num_partitions = 100

[DirichletPartitioner Settings]
training_dataset_min_partition_size = 1
training_dataset_alpha = 0.3
training_dataset_partition_by = label
training_dataset_self_balancing = False
training_dataset_shuffle = True
training_dataset_seed = 42
test_dataset_min_partition_size = 1
test_dataset_alpha = 0.3
test_dataset_partition_by = label
test_dataset_self_balancing = False
test_dataset_shuffle = True
test_dataset_seed = 42

[PathologicalPartitioner Settings]
training_dataset_partition_by = label
training_num_classes_per_partition = 2
training_class_assignment_mode = first-deterministic
training_dataset_shuffle = True
training_dataset_seed = 42
test_dataset_partition_by = label
test_num_classes_per_partition = 2
test_class_assignment_mode = first-deterministic
test_dataset_shuffle = True
test_dataset_seed = 42

[Task Assignment Capacities Settings]
task_assignment_capacities_train = []
task_assignment_capacities_test = []
lower_bound = 0
upper_bound = client_capacity
step = 50

[Energy Monitoring Settings]
